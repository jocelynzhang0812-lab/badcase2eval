# Ruff configuration for evalskill
# See: https://docs.astral.sh/ruff/configuration/

target-version = "py310"

exclude = [
    "scripts/preset/preset.py",  # YAML config file with .py extension
]

[lint]
# Start with core rules, expand later
select = [
    "F",    # Pyflakes (unused imports, undefined names, etc.)
    "E",    # pycodestyle errors
]
ignore = [
    "E402",  # module-level import not at top  too many intentional cases
    "E501",  # line too long  not enforcing for now
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
]
